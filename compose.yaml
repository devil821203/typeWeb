services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: typeweb
      POSTGRES_USER: ${DB_USER:-typeweb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d typeweb']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/typeweb
      DB_USER: ${DB_USER:-typeweb}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/api/health']
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 15
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - '${APP_PORT:-8088}:80'
    environment:
      API_UPSTREAM: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
